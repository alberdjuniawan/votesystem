basePath: /api/v1
definitions:
  github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail:
    properties:
      code:
        type: string
      details: {}
      message:
        type: string
    type: object
  github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
      meta: {}
      request_id:
        type: string
      success:
        type: boolean
    type: object
  internal_modules_auth.AuthResponse:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
      user:
        $ref: '#/definitions/internal_modules_auth.UserResponse'
    type: object
  internal_modules_auth.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  internal_modules_auth.RegisterRequest:
    properties:
      email:
        type: string
      name:
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
    required:
    - email
    - name
    - password
    type: object
  internal_modules_auth.UserResponse:
    properties:
      email:
        type: string
      id:
        type: string
      name:
        type: string
      role:
        type: string
    type: object
  internal_modules_leaderboard.LeaderboardResponse:
    properties:
      room_id:
        type: string
      scores:
        items:
          $ref: '#/definitions/internal_modules_leaderboard.OptionScore'
        type: array
      total:
        type: integer
    type: object
  internal_modules_leaderboard.OptionScore:
    properties:
      option_id:
        type: string
      vote_count:
        type: integer
    type: object
  internal_modules_media.MediaResponse:
    properties:
      created_at:
        type: string
      filename:
        type: string
      id:
        type: string
      mime_type:
        type: string
      original_name:
        type: string
      size_bytes:
        type: integer
      url:
        type: string
    type: object
  internal_modules_option.CreateOptionRequest:
    properties:
      description:
        type: string
      label:
        maxLength: 255
        minLength: 1
        type: string
      media_id:
        type: string
      metadata:
        items:
          type: integer
        type: array
      order_num:
        type: integer
    required:
    - label
    type: object
  internal_modules_option.OptionResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      label:
        type: string
      media_id:
        type: string
      media_url:
        type: string
      metadata:
        items:
          type: integer
        type: array
      order_num:
        type: integer
      room_id:
        type: string
    type: object
  internal_modules_option.UpdateOptionRequest:
    properties:
      description:
        type: string
      label:
        maxLength: 255
        minLength: 1
        type: string
      media_id:
        type: string
      metadata:
        items:
          type: integer
        type: array
      order_num:
        type: integer
    type: object
  internal_modules_room.CreateRoomRequest:
    properties:
      description:
        type: string
      ends_at:
        type: string
      max_votes:
        minimum: 1
        type: integer
      show_realtime:
        type: boolean
      starts_at:
        type: string
      title:
        maxLength: 255
        minLength: 3
        type: string
      type:
        enum:
        - single_choice
        - multiple_choice
        type: string
    required:
    - title
    - type
    type: object
  internal_modules_room.RoomResponse:
    properties:
      created_at:
        type: string
      description:
        type: string
      ends_at:
        type: string
      id:
        type: string
      max_votes:
        type: integer
      owner_id:
        type: string
      share_code:
        type: string
      share_url:
        type: string
      show_realtime:
        type: boolean
      starts_at:
        type: string
      status:
        type: string
      title:
        type: string
      type:
        type: string
    type: object
  internal_modules_room.UpdateRoomStatusRequest:
    properties:
      status:
        enum:
        - draft
        - active
        - closed
        type: string
    required:
    - status
    type: object
  internal_modules_vote.CastVoteRequest:
    properties:
      option_id:
        type: string
    required:
    - option_id
    type: object
  internal_modules_vote.MyVoteResponse:
    properties:
      has_voted:
        type: boolean
      room_id:
        type: string
      room_type:
        type: string
      votes:
        items:
          $ref: '#/definitions/internal_modules_vote.VoteResponse'
        type: array
    type: object
  internal_modules_vote.VoteResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      option_id:
        type: string
      room_id:
        type: string
      user_id:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: alberd@example.com
    name: Alberd Juniawan Pasunda
    url: https://github.com/alberdjuniawan
  description: API documentation for the VoteSystem platform.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: VoteSystem API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticates a user with email and password, returning JWT access
        and refresh tokens.
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully logged in
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_auth.AuthResponse'
              type: object
        "400":
          description: Invalid input data
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
        "401":
          description: Invalid email or password
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
      summary: Login user
      tags:
      - auth
  /auth/me:
    get:
      consumes:
      - application/json
      description: Retrieves the profile information of the currently authenticated
        user based on the provided JWT token.
      produces:
      - application/json
      responses:
        "200":
          description: User profile retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_auth.UserResponse'
              type: object
        "401":
          description: Access denied, invalid or expired token
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
      security:
      - BearerAuth: []
      summary: Get current user profile
      tags:
      - auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Creates a new user account and returns authentication tokens.
      parameters:
      - description: Registration details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_auth.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully registered
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_auth.AuthResponse'
              type: object
        "400":
          description: Invalid input data or validation error
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
        "409":
          description: Email already exists
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
      summary: Register a new user
      tags:
      - auth
  /media:
    post:
      consumes:
      - multipart/form-data
      description: Uploads an image file (jpeg, png, webp) up to 5MB to MinIO and
        returns the media details. Requires authentication.
      parameters:
      - description: Image file to upload
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: File successfully uploaded
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_media.MediaResponse'
              type: object
        "400":
          description: Invalid file, missing field, or file too large
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
        "401":
          description: Access denied, invalid or expired token
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
      security:
      - BearerAuth: []
      summary: Upload media file
      tags:
      - media
  /media/{id}:
    delete:
      consumes:
      - application/json
      description: Deletes a specific media file by its ID. Only the original uploader
        is authorized to delete it.
      parameters:
      - description: Media ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Access denied, invalid or expired token
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
        "403":
          description: Forbidden, you are not the uploader
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
        "404":
          description: Media not found
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
      security:
      - BearerAuth: []
      summary: Delete media file
      tags:
      - media
  /rooms:
    get:
      consumes:
      - application/json
      description: Retrieves a list of all voting rooms created by the authenticated
        user.
      produces:
      - application/json
      responses:
        "200":
          description: List of rooms retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_modules_room.RoomResponse'
                  type: array
              type: object
        "401":
          description: Access denied, invalid or expired token
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
      security:
      - BearerAuth: []
      summary: List user's rooms
      tags:
      - room
    post:
      consumes:
      - application/json
      description: Creates a new voting room with specific configurations. The caller
        automatically becomes the room owner.
      parameters:
      - description: Room creation details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_room.CreateRoomRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Room successfully created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_room.RoomResponse'
              type: object
        "400":
          description: Invalid input or max votes
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
        "401":
          description: Access denied, invalid or expired token
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
        "500":
          description: Internal server error or share code collision
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
      security:
      - BearerAuth: []
      summary: Create a new voting room
      tags:
      - room
  /rooms/{id}:
    delete:
      consumes:
      - application/json
      description: Permanently deletes a room. Only the room owner can perform this
        action.
      parameters:
      - description: Room ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "401":
          description: Access denied, invalid or expired token
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
        "403":
          description: Forbidden, you are not the room owner
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
        "404":
          description: Room not found
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
      security:
      - BearerAuth: []
      summary: Delete a room
      tags:
      - room
    get:
      consumes:
      - application/json
      description: Retrieves the full details of a specific voting room using its
        UUID.
      parameters:
      - description: Room ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Room details retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_room.RoomResponse'
              type: object
        "401":
          description: Access denied, invalid or expired token
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
        "404":
          description: Room not found
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
      security:
      - BearerAuth: []
      summary: Get room details by ID
      tags:
      - room
  /rooms/{id}/leaderboard:
    get:
      consumes:
      - application/json
      description: Retrieves the real-time leaderboard and vote counts for a specific
        voting room.
      parameters:
      - description: Room ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Leaderboard retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_leaderboard.LeaderboardResponse'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
      summary: Get room leaderboard
      tags:
      - leaderboard
  /rooms/{id}/options:
    get:
      consumes:
      - application/json
      description: Retrieves all voting options associated with a specific room.
      parameters:
      - description: Room ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Options retrieved successfully
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/internal_modules_option.OptionResponse'
                  type: array
              type: object
        "404":
          description: Room not found
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
        "500":
          description: Internal server error
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
      summary: List room options
      tags:
      - option
    post:
      consumes:
      - application/json
      description: Adds a new option to a specific room. The room must be in "draft"
        status and the caller must be the room owner.
      parameters:
      - description: Room ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Option details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_modules_option.CreateOptionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Option successfully created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                data:
                  $ref: '#/definitions/internal_modules_option.OptionResponse'
              type: object
        "400":
          description: Invalid input or room is not in draft status
          schema:
            allOf:
            - $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.WebResponse'
            - properties:
                error:
                  $ref: '#/definitions/github_com_alberdjuniawan_votesystem_internal_shared_response.ErrorDetail'
              type: object
        "403":
          description: Forbidden, you are not the room owner
